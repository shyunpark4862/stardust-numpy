[project]
name = "sdnp"
version = "0.1.0"
description = "Educational NumPy-style arrays backed by Rust sdnp"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "numpy>=2.0",
    "pytest>=8.0",
    "tqdm>=4.69.1",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "property: randomized Hypothesis differential tests",
]
